services:
  - type: web
    name: myemailbuddy-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.13
      - key: APP_ENV
        value: production
      - key: PILOT_ACCESS_REQUIRED
        value: "false"
      - key: PUBLIC_REQUESTS_PER_DAY
        value: "100"
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
